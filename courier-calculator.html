<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Landed Cost & Volumetric Auditor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #4F6EF7; --red: #f85149; --green: #2ea043; --border: #30363d; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding: 2rem; line-height: 1.6; }
        h1, h2 { font-family: 'Sora', sans-serif; color: #fff; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 1000px; margin: 0 auto; }
        .card { background: var(--card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); }
        label { display: block; margin-top: 15px; font-size: 0.85rem; font-weight: 500; color: #8b949e; text-transform: uppercase; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: var(--bg); color: #fff; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .output-box { margin-top: 20px; padding: 20px; background: var(--bg); border-radius: 8px; border-left: 4px solid var(--accent); }
        .metric { font-size: 1.8rem; font-weight: 700; color: #fff; display: block; }
    </style>
</head>
<body>
    <div style="max-width: 1000px; margin: 0 auto 2rem;">
        <a href="index.html" style="color:var(--accent); text-decoration:none;">&larr; Back to Portfolio</a>
        <h1 style="margin-top: 10px;">Landed Courier Cost & Volumetric Leak Auditor</h1>
        <p>Stop paying for cardboard air. Audit your true per-parcel invoice cost.</p>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Your Contracted Rates</h2>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div><label>Base Rate (1st kg)</label><input type="number" id="base_rate" value="180"></div>
                <div><label>Additional KG Rate</label><input type="number" id="add_rate" value="150"></div>
                <div><label>FAS Surcharge (%)</label><input type="number" id="fas" value="18"></div>
                <div><label>Sales Tax (GST/PRA %)</label><input type="number" id="gst" value="15"></div>
                <div><label>COD Handling Fee (%)</label><input type="number" id="cod_fee" value="2.5"></div>
                <div><label>Flyer/Packaging Cost</label><input type="number" id="flyer" value="25"></div>
            </div>
            
            <h3 style="margin-top: 20px; color:#8b949e; font-size:0.9rem;">Parcel Reality</h3>
            <div style="display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;">
                <div><label>L (cm)</label><input type="number" id="dim_l" value="30"></div>
                <div><label>W (cm)</label><input type="number" id="dim_w" value="20"></div>
                <div><label>H (cm)</label><input type="number" id="dim_h" value="15"></div>
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                <div><label>Dead Weight (KG)</label><input type="number" id="dead_w" value="0.8"></div>
                <div><label>Parcel COD Value</label><input type="number" id="order_val" value="4500"></div>
            </div>
        </div>

        <div class="card">
            <h2>Audit Results</h2>
            <div class="output-box" id="vol_warning"></div>
            <div class="output-box">
                <span style="color:#8b949e; font-size:0.85rem;">True Landed Courier Deduction</span>
                <span class="metric" id="total_cost">PKR 0</span>
            </div>
            <canvas id="costChart" style="margin-top:20px;"></canvas>
        </div>
    </div>

    <script>
        let costChart;
        function auditCourier() {
            const base = Number(document.getElementById('base_rate').value);
            const add = Number(document.getElementById('add_rate').value);
            const fas = Number(document.getElementById('fas').value) / 100;
            const gst = Number(document.getElementById('gst').value) / 100;
            const cod_fee = Number(document.getElementById('cod_fee').value) / 100;
            const flyer = Number(document.getElementById('flyer').value);
            
            const l = Number(document.getElementById('dim_l').value);
            const w = Number(document.getElementById('dim_w').value);
            const h = Number(document.getElementById('dim_h').value);
            const dead = Number(document.getElementById('dead_w').value);
            const val = Number(document.getElementById('order_val').value);

            const vol_weight = (l * w * h) / 5000;
            const billed_weight = Math.max(dead, vol_weight);
            const billed_kg = Math.ceil(billed_weight);

            let freight = base;
            if(billed_kg > 1) freight += (billed_kg - 1) * add;

            const fas_amt = freight * fas;
            const subtotal = freight + fas_amt;
            const gst_amt = subtotal * gst;
            const cod_amt = val * cod_fee;
            
            const total = freight + fas_amt + gst_amt + cod_amt + flyer;

            const warnBox = document.getElementById('vol_warning');
            if(vol_weight > dead && Math.ceil(vol_weight) > Math.ceil(dead)) {
                warnBox.style.borderLeftColor = "var(--red)";
                warnBox.innerHTML = `<strong style="color:var(--red)">Volumetric Trap Detected!</strong><br>Your item weighs ${dead}kg, but your box size bills at ${billed_weight.toFixed(2)}kg. You are paying for the ${billed_kg}kg slab.`;
            } else {
                warnBox.style.borderLeftColor = "var(--green)";
                warnBox.innerHTML = `<strong style="color:var(--green)">Packaging Optimized</strong><br>Your box dimensions do not trigger higher weight slabs.`;
            }

            document.getElementById('total_cost').innerText = 'PKR ' + total.toFixed(0);

            const ctx = document.getElementById('costChart').getContext('2d');
            if(costChart) costChart.destroy();
            costChart = new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Base Freight', 'FAS', 'Sales Tax', 'COD Fee', 'Packaging'],
                    datasets: [{
                        data: [freight, fas_amt, gst_amt, cod_amt, flyer],
                        backgroundColor: ['#4F6EF7', '#f85149', '#d29922', '#2ea043', '#8b949e'],
                        borderWidth: 0
                    }]
                },
                options: { responsive: true, cutout: '70%', plugins: { legend: { position: 'right', labels: {color: '#c9d1d9'} } } }
            });
        }
        document.querySelectorAll('input').forEach(i => i.addEventListener('input', auditCourier));
        auditCourier();
    </script>
</body>
</html>
