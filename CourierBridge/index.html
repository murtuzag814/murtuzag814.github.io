<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courier Bridge | E-Commerce Fulfillment</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-100 text-gray-800 font-sans relative">

    <!-- Navbar -->
    <nav class="bg-white shadow px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-bold text-gray-900">Courier Bridge</h1>
        <button id="settingsBtn" class="text-sm font-semibold text-blue-600 hover:underline">⚙️ Brand Settings</button>
    </nav>

    <div class="max-w-5xl mx-auto mt-10 grid grid-cols-2 gap-8 px-6">
        
        <!-- FORWARD FLOW: Shopify -> Courier -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-blue-600">
            <h2 class="text-lg font-bold mb-2">1. Forward Flow (Booking)</h2>
            <p class="text-sm text-gray-500 mb-4">Export from Shopify -> Generate Courier File</p>
            
            <!-- Courier Selector -->
            <div class="mb-4">
                <label class="block text-sm font-bold mb-2">Select Booking Type:</label>
                <select id="courierSelect" class="w-full border p-2 rounded">
                    <option value="trax_regular">Trax - Regular Shipment</option>
                    <option value="trax_reverse">Trax - Reverse Pickup</option>
                    <option value="tcs_regular">TCS - Regular Shipment</option>
                </select>
            </div>

            <div class="border-2 border-dashed border-gray-300 p-6 text-center rounded mb-4 bg-gray-50">
                <input type="file" id="shopifyCsv" accept=".csv" class="w-full text-sm">
            </div>
            
            <button id="generateBookingBtn" class="w-full bg-blue-600 text-white font-bold py-2 rounded hover:bg-blue-700">
                Generate Booking Excel
            </button>
        </div>

        <!-- REVERSE FLOW: Courier -> Shopify -->
        <div class="bg-white p-6 rounded-lg shadow-md border-t-4 border-green-600">
            <h2 class="text-lg font-bold mb-2">2. Reverse Flow (Fulfillment)</h2>
            <p class="text-sm text-gray-500 mb-4">Upload Courier Report -> Auto-Fulfill in Shopify</p>
            
            <div class="border-2 border-dashed border-gray-300 p-6 text-center rounded mb-4 bg-gray-50">
                <input type="file" id="courierTrackingCsv" accept=".csv, .xlsx" class="w-full text-sm">
            </div>
            
            <button id="fulfillOrdersBtn" class="w-full bg-green-600 text-white font-bold py-2 rounded hover:bg-green-700">
                Sync Tracking to Shopify
            </button>
            <p class="text-xs text-gray-400 mt-2 text-center">*Requires Shopify Custom App Setup</p>
        </div>
    </div>

    <!-- DYNAMIC SETTINGS MODAL -->
    <div id="settingsModal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex justify-center items-center">
        <div class="bg-white p-6 rounded-lg shadow-lg w-96">
            <h2 id="modalTitle" class="text-lg font-bold mb-4">Settings</h2>
            <div id="modalBody" class="space-y-4 mb-4">
                <!-- Inputs injected dynamically via app.js -->
            </div>
            <div class="flex justify-end space-x-2">
                <button id="closeModalBtn" class="px-4 py-2 bg-gray-300 rounded hover:bg-gray-400">Cancel</button>
                <button id="saveModalBtn" class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700">Save Config</button>
            </div>
        </div>
    </div>

    <!-- Scripts (Adapters removed for dynamic loading) -->
    <script src="js/cities.js"></script>
    <script src="js/parser.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
