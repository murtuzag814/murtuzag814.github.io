name: Auto-Build Portfolio

on:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 0 * * *'  # Nightly freshness rotation
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip

      - name: Build Posts
        run: python scripts/build_posts.py

      - name: Build Videos
        run: python scripts/build_videos.py

      - name: Build White Vault
        run: python scripts/build_white_vault.py

      - name: Build Black Vault
        run: python scripts/build_black_vault.py

      - name: Update Metadata (Freshness)
        run: python scripts/update_metadata.py

      - name: Generate Sitemap
        run: python scripts/generate_sitemap.py

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-build: Update site content [skip ci]"
            git push
          fi