name: Auto-Build Portfolio

on:
  push:
    branches: [ main ]
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write  # Needed to commit changes back to repo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper commits

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies (if any)
        run: |
          python -m pip install --upgrade pip
          # No external dependencies needed for now (BeautifulSoup not required)
          # We use pure Python + regex.

      - name: Run Post Builder
        run: python scripts/build_posts.py

      - name: Run Video Builder
        run: python scripts/build_videos.py

      - name: Update Metadata (Freshness)
        run: |
          # Placeholder for future metadata script
          echo "Metadata update skipped (script not yet created)"

      - name: Generate Sitemap
        run: |
          # Placeholder for future sitemap script
          echo "Sitemap generation skipped (script not yet created)"

      - name: Commit and push changes
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add -A
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto-build: Update site content [skip ci]"
            git push
          fi
