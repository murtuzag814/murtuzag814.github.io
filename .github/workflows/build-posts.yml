name: Auto-Build Posts into Portfolio

on:
  push:
    paths:
      - 'posts_src/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Run post builder
        run: python scripts/build_posts.py
          
      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html updates.html feed.xml sitemap.xml posts/
          git diff --staged --quiet || (git commit -m "Auto-update: posts rebuilt" && git push)
