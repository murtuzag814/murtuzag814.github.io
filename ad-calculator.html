<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COD Ad Profitability Engine | Ghulam Murtuza</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #58a6ff; --red: #f85149; --green: #2ea043; }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); padding: 20px; line-height: 1.5; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: var(--card); padding: 20px; border-radius: 8px; border: 1px solid #30363d; }
        h1, h2, h3 { color: #fff; margin-top: 0; }
        label { display: block; margin-top: 10px; font-size: 0.9em; }
        input[type="number"], input[type="range"] { width: 100%; padding: 8px; margin-top: 5px; background: var(--bg); color: #fff; border: 1px solid #30363d; border-radius: 4px; box-sizing: border-box; }
        .metric { font-size: 1.5em; font-weight: bold; margin-top: 10px; }
        .text-red { color: var(--red); } .text-green { color: var(--green); } .text-accent { color: var(--accent); }
        @media (max-width: 768px) { .container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <!-- Meta Ads Calculator -->
    <div class="card">
        <h2>Meta Ads: True COD ROAS</h2>
        <p style="font-size:0.85em; color:#8b949e;">Strips phantom revenue to show actual banked cash.</p>
        
        <label>Daily Ad Spend (PKR)</label>
        <input type="number" id="m_spend" value="10000">
        
        <label>Reported Cost Per Purchase (CPP)</label>
        <input type="number" id="m_cpp" value="1000">
        
        <label>Average Order Value (AOV)</label>
        <input type="number" id="m_aov" value="3500">
        
        <label>Cost of Goods Sold (COGS per unit)</label>
        <input type="number" id="m_cogs" value="1200">
        
        <label>RTO Rate (%) <span id="rto_val">25</span>%</label>
        <input type="range" id="m_rto" min="0" max="60" value="25" oninput="document.getElementById('rto_val').innerText=this.value; calculateMeta();">
        
        <label>Reverse Shipping Penalty (PKR)</label>
        <input type="number" id="m_rev" value="250">
        
        <div style="margin-top: 20px; padding: 15px; background: #0d1117; border-radius: 6px;">
            <div>Reported ROAS: <span class="metric text-accent" id="m_rep_roas">0</span></div>
            <div>True Delivered ROAS: <span class="metric text-red" id="m_true_roas">0</span></div>
            <div>Net Banked Profit: <span class="metric text-green" id="m_net">0</span></div>
        </div>
    </div>

    <div class="card">
        <canvas id="metaChart"></canvas>
    </div>
</div>

<script>
    let metaChart;

    function calculateMeta() {
        const spend = parseFloat(document.getElementById('m_spend').value);
        const cpp = parseFloat(document.getElementById('m_cpp').value);
        const aov = parseFloat(document.getElementById('m_aov').value);
        const cogs = parseFloat(document.getElementById('m_cogs').value);
        const rto = parseFloat(document.getElementById('m_rto').value) / 100;
        const rev_pen = parseFloat(document.getElementById('m_rev').value);

        const total_orders = spend / cpp;
        const rep_revenue = total_orders * aov;
        const rep_roas = rep_revenue / spend;

        const delivered_orders = total_orders * (1 - rto);
        const rto_orders = total_orders * rto;
        
        const actual_revenue = delivered_orders * aov;
        const total_cogs = delivered_orders * cogs; // Assuming RTO stock is recovered
        const total_rto_penalty = rto_orders * rev_pen;
        const courier_fwd = delivered_orders * 200; // Base forward shipping estimate
        
        const net_profit = actual_revenue - total_cogs - spend - courier_fwd - total_rto_penalty;
        const true_roas = actual_revenue / spend;

        document.getElementById('m_rep_roas').innerText = rep_roas.toFixed(2) + 'x';
        document.getElementById('m_true_roas').innerText = true_roas.toFixed(2) + 'x';
        document.getElementById('m_net').innerText = 'PKR ' + net_profit.toFixed(0);

        updateChart(actual_revenue, total_cogs, spend, courier_fwd, total_rto_penalty, net_profit);
    }

    function updateChart(rev, cogs, spend, fwd, rto_pen, net) {
        const ctx = document.getElementById('metaChart').getContext('2d');
        if(metaChart) metaChart.destroy();
        
        metaChart = new Chart(ctx, {
            type: 'bar',
            data: {
                labels: ['Gross Revenue', 'COGS', 'Ad Spend', 'Shipping', 'RTO Penalty', 'Net Profit'],
                datasets: [{
                    label: 'PKR',
                    data: [rev, -cogs, -spend, -fwd, -rto_pen, net],
                    backgroundColor: ['#2ea043', '#f85149', '#f85149', '#f85149', '#f85149', net > 0 ? '#2ea043' : '#f85149']
                }]
            },
            options: { responsive: true, plugins: { legend: { display: false } } }
        });
    }

    document.querySelectorAll('input').forEach(i => i.addEventListener('input', calculateMeta));
    calculateMeta();
</script>
</body>
</html>
