<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discount Volume Trap Simulator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0d1117; --card: #161b22; --text: #c9d1d9; --accent: #d29922; --border: #30363d; }
        body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); padding: 2rem; line-height: 1.6; }
        h1, h2 { font-family: 'Sora', sans-serif; color: #fff; margin-top: 0; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; max-width: 900px; margin: 0 auto; }
        .card { background: var(--card); padding: 2rem; border-radius: 12px; border: 1px solid var(--border); }
        label { display: block; margin-top: 15px; font-size: 0.85rem; font-weight: 500; color: #8b949e; text-transform: uppercase; }
        input { width: 100%; padding: 10px; margin-top: 5px; background: var(--bg); color: #fff; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .output-box { margin-top: 20px; padding: 20px; background: var(--bg); border-radius: 8px; border-left: 4px solid var(--accent); }
        .metric { font-size: 2rem; font-weight: 700; color: #fff; display: block; }
    </style>
</head>
<body>
    <div style="max-width: 900px; margin: 0 auto 2rem;">
        <a href="index.html" style="color:#58a6ff; text-decoration:none;">&larr; Back to Portfolio</a>
        <h1 style="margin-top: 10px;">Flash Sale Volume Trap Simulator</h1>
        <p>Running a 20% off sale? Calculate exactly how many extra orders you need just to break even on profit.</p>
    </div>

    <div class="grid">
        <div class="card">
            <h2>Current Economics</h2>
            <div><label>Normal Selling Price (PKR)</label><input type="number" id="price" value="3500"></div>
            <div><label>Landed COGS + Fulfillment (PKR)</label><input type="number" id="cogs" value="1600"></div>
            <div><label>Current Daily Orders</label><input type="number" id="orders" value="50"></div>
            
            <hr style="border-color:var(--border); margin:20px 0;">
            
            <h2>Proposed Sale</h2>
            <div><label>Discount Offered (%)</label><input type="number" id="discount" value="20"></div>
        </div>

        <div class="card">
            <h2>The Reality Check</h2>
            <div class="output-box">
                <span style="color:#8b949e; font-size:0.85rem;">To make the exact same profit, you now need:</span>
                <span class="metric" id="req_orders">0 Orders/Day</span>
                <span id="increase_text" style="color:#f85149; font-weight:bold; margin-top:5px; display:block;"></span>
            </div>
            <canvas id="volumeChart" style="margin-top:30px;"></canvas>
        </div>
    </div>

    <script>
        let volChart;
        function calcVolume() {
            const price = Number(document.getElementById('price').value);
            const cogs = Number(document.getElementById('cogs').value);
            const orders = Number(document.getElementById('orders').value);
            const discount = Number(document.getElementById('discount').value) / 100;

            const current_margin = price - cogs;
            const current_profit = current_margin * orders;

            const new_price = price * (1 - discount);
            const new_margin = new_price - cogs;

            const reqBox = document.getElementById('req_orders');
            const incText = document.getElementById('increase_text');

            if (new_margin <= 0) {
                reqBox.innerText = "IMPOSSIBLE";
                incText.innerText = "You are losing money on every unit sold.";
                updateChart(orders, 0);
                return;
            }

            const required_orders = Math.ceil(current_profit / new_margin);
            const percentage_increase = (((required_orders - orders) / orders) * 100).toFixed(0);

            reqBox.innerText = required_orders + ' Orders/Day';
            incText.innerText = `That is a ${percentage_increase}% increase in volume just to break even.`;

            updateChart(orders, required_orders);
        }

        function updateChart(curr, req) {
            const ctx = document.getElementById('volumeChart').getContext('2d');
            if(volChart) volChart.destroy();
            volChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: ['Current Orders', 'Required Orders on Sale'],
                    datasets: [{
                        label: 'Daily Order Volume',
                        data: [curr, req],
                        backgroundColor: ['#30363d', '#d29922'],
                        borderRadius: 6
                    }]
                },
                options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true, grid: { color: '#30363d' }, ticks: { color: '#8b949e' } }, x: { ticks: { color: '#c9d1d9' } } } }
            });
        }

        document.querySelectorAll('input').forEach(i => i.addEventListener('input', calcVolume));
        calcVolume();
    </script>
</body>
</html>
